<!DOCTYPE html>
<html>
<head>
  <!--
    /account/ is replaced by the value of `--base-href` at build
    time (e.g. "/account/" when served from GitHub Pages).
  -->
  <base href="/account/">
  <meta charset="UTF-8">
  <!--
    The decrypted master key lives in this page's memory: only our own code
    may run, and it may only talk to our Supabase project. 'wasm-unsafe-eval'
    is for CanvasKit and libsodium (WebAssembly). Built with
    --no-web-resources-cdn --csp, so CanvasKit is served from here. Unlike the
    other Klyra web apps there is no fonts.gstatic.com: a character Nunito
    lacks shows a missing-glyph box rather than asking Google for a font.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://qvphnekcdnrczxkabyrs.supabase.co wss://qvphnekcdnrczxkabyrs.supabase.co; font-src 'self' data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Klyra Account: sign in, create your account and manage it. One account for all Klyra apps.">

  <meta name="mobile-web-app-capable" content="yes">
  <!-- The page runs under the status bar; #klyra-app stops at it and the
       strip shows the app's background (see klyra_chrome.js). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FBFAFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13101F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Klyra Account">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Klyra Account</title>
  <link rel="manifest" href="manifest.json">
  <!-- libsodium (sumo) for package:sodium; loaded before the Flutter bootstrap. -->
  <script src="sodium.js"></script>
  <script src="klyra_chrome.js"></script>
  <style>
    :root { --klyra-top: #FBFAFF; --klyra-bottom: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --klyra-top: #13101F; --klyra-bottom: #1E1A31; }
    }
    /* Solid colors only: iOS (26.1+) paints the installed web app's status
       bar from the page background and can't read a gradient (it shows
       white). The home-indicator strip is its own element instead. */
    html, body { margin: 0; height: 100%; background-color: var(--klyra-top); }
    #klyra-bottom {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      height: env(safe-area-inset-bottom, 0);
      background-color: var(--klyra-bottom);
    }
    #klyra-app {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0);
      left: env(safe-area-inset-left, 0);
    }
  </style>
</head>
<body>
  <div id="klyra-bottom"></div>
  <div id="klyra-app"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
